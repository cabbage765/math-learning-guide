  <main class="wrap">
    <h1>章節練習：康軒國一上學期</h1>
    <p class="lead">點進單元，可以看到這個單元的關鍵建議，以及可以直接作答的練習題。題目特別挑了「數字看起來很大，看懂就不用硬算」的類型。</p>

    <div id="chapters"></div>

    <div class="card">
      <h2>答題回饋</h2>
      <p>答對時會出現讚美、答錯時會出現鼓勵，搭配 BABYMONSTER、帕洽狗、大耳狗、宋承叡的主題。可以把自己準備的圖片放進來，答題時就會出現。</p>
      <a class="btn" href="rewards.html">前往獎勵設定 →</a>
    </div>

    <p class="note">章節名稱依 108 課綱康軒版整理，不同年度的版本可能略有差異，請以課本為準。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">本站整理自與 Claude 的對話，內容僅供參考，不能取代老師或專業人員的評估。</div>
  </footer>

  <script src="js/sections.js?v=7"></script>
  <script>
    (function () {
      function solvedCount(id) {
        try {
          return Object.keys(JSON.parse(localStorage.getItem('progress3-' + id) || '{}')).length;
        } catch (e) {
          return 0;
        }
      }

      var html = window.CHAPTERS.map(function (ch) {
        var items = ch.sections.map(function (s) {
          var data = window.SECTIONS[s.id];
          if (!data) {
            return '<li><span class="section-row soon"><span>' + s.id + '　' + s.title + '</span><span class="pill">製作中</span></span></li>';
          }
          var total = data.groups.reduce(function (n, g) { return n + g.questions.length; }, 0);
          var done = solvedCount(s.id);
          var pill = done === total
            ? '<span class="pill ok">全部答對</span>'
            : '<span class="pill">' + (done ? '已答對 ' + done + ' / ' : '') + total + ' 題</span>';
          return '<li><a class="section-row" href="practice.html?s=' + s.id + '"><span>' + s.id + '　' + s.title + '</span>' + pill + '</a></li>';
        }).join('');
        return '<div class="card chapter"><h2>第 ' + ch.no + ' 章　' + ch.title + '</h2><ul class="section-list">' + items + '</ul></div>';
      }).join('');

      document.getElementById('chapters').innerHTML = html;
    })();
  </script>
